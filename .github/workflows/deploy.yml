name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo -n "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key_path: ~/.ssh/deploy_key
          script: |
            cd ~/app-escalada
            git pull origin main

            npm install
            npm run build

            sudo rm -rf /var/www/escalada/*
            sudo cp -r dist/* /var/www/escalada/
